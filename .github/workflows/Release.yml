---
on: 
  push:
    tags:
    - '*'

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Fetch changelog
      id: changelog
      run: >
        git diff -U0 v0.67..master changelog.txt | 
        tail -n+9 | sed -e 's/#/##/g' | sed -e 's/^+//g' >> body.md
    - name: Create release
      uses: ncipollo/release-action@v1
      id: release
      with:
        bodyFile: 'body.md'
        discussionCategory: 'General'
        draft: true
        name: 'CorsixTH 0.68'
        prerelease: $${{(contains(github.event.ref_name, fromJSON('["beta", "rc"]')) && 'true' || ''}}
